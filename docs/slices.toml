# Tsumugi — 実装スライス一覧（状態の正本）
#
# このファイルは「実装スライス」（1 スライス = 1 実装 PR）の一覧と状態の唯一の正本である。
# 書き手・承認・状態遷移・ready の条件などの運用規則は docs/documentation-guide.md
# 「実装スライスの運用」だけに書く。ここにはフィールドの定義だけを置く。
#
# ── status ─────────────────────────────────────────────────────
#   todo     未設計。spec に実装範囲・受入基準がまだない
#   ready    設計承認済み。実装ループが着手してよい
#   done     実装済み（実装 PR がマージされた）
#   blocked  外部要因で着手不可。blocked_reason 必須
#
# ── フィールド ─────────────────────────────────────────────────
#   id              必須。リポジトリ全体で一意。spec に既存の名前（R-1b、F-2 など）があればそれを使う。
#                   名前がなければ kebab-case の仮 ID とし、status = todo の間だけ改名してよい。
#   title           必須。一行概要。詳細は spec に書く
#   status          必須。上記 4 値のいずれか
#   parent          必須。roadmap.md「ステータス一覧」の ID（REV-015、Phase 6 残 など）
#   spec_slice      任意。spec 側の粗い slice（例: "determinism Slice 5"、"E9"、"C12"）
#   spec            ready / done で必須。{ doc = "docs/…md", section = "見出しテキスト（完全一致）" }
#   acceptance      ready で必須（空配列不可）。受入基準 ID のみ。範囲は "B2-AT-01..10" と書く
#   depends_on      任意。先に done になっている必要があるスライスの id
#   order           todo / ready で必須。着手順。小さいほど先。ループは ready のうち最小を選ぶ
#   blocked_reason  blocked で必須
#   design_pr       todo → ready にした設計 PR の番号（PR 作成後、同じ PR に追記する）
#   impl_pr         ready → done にした実装 PR の番号（同上）
#   issues          任意。このスライスで立った needs-design issue の番号（履歴として残す）
#
# ready の条件（Definition of Ready）は documentation-guide.md を参照。
# フィールド定義どおりに書かれているかは tests/slices_contract.rs が cargo test（CI）で検証する。

# ════════════════════════════════════════════════════════════════
# 実装済み（依存関係の起点として載せる）
# ════════════════════════════════════════════════════════════════

